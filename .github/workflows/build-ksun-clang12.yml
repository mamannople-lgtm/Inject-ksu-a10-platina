        \ int may_context_mount_inode_relabel(u32 sid,\n \t\t\tstruct superblock_security_struct *sbsec,\n \t\t\t\
        const struct cred *cred)\n {\n-\tconst struct task_security_struct *tsec = cred->security;\n+\tconst struct\
        \ task_security_struct *tsec = selinux_cred(cred);\n \tint rc;\n \trc = avc_has_perm(tsec->sid, sbsec->sid,\
