        \ \t\treturn 0;\n \n \tsid = cred_sid(cred);\n-\tisec = inode->i_security;\n+\tisec = selinux_inode(inode);\n\
        \ \n \treturn avc_has_perm(sid, isec->sid, isec->sclass, perms, adp);\n }\n@@ -1729,7 +1729,7 @@ static\
        \ int selinux_determine_inode_label(const struct inode *dir,\n {\n \tconst struct superblock_security_struct\
        \ *sbsec = dir->i_sb->s_security;\n \tconst struct inode_security_struct *dsec = dir->i_security;\n-\tconst\
        \ struct task_security_struct *tsec = current_security();\n+\tconst struct task_security_struct *tsec =\
        \ selinux_cred(current_cred());\n \n \tif ((sbsec->flags & SE_SBINITIALIZED) &&\n \t    (sbsec->behavior\
        \ == SECURITY_FS_USE_MNTPOINT)) {\n@@ -1750,7 +1750,7 @@ static int may_create(struct inode *dir,\n \t\t\
        \      struct dentry *dentry,\n \t\t      u16 tclass)\n {\n-\tconst struct task_security_struct *tsec =\
