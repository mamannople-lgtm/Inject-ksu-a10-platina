name: Platina KernelSU Next | Clang 12

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'KernelSU Next branch or commit (default: legacy)'
        required: true
        default: legacy
        type: string
      build_jobs:
        description: 'Number of parallel jobs (2 recommended for GitHub-hosted runners)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

permissions:
  contents: read

concurrency:
  group: platina-ksun-clang12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: GitHubActions
      KBUILD_BUILD_HOST: platina-clang12
      KERNEL_REPO: https://github.com/FirmanBell/msm-4.4.git
      KERNEL_BRANCH: legacy
      DEFCONFIG: platina_defconfig
      CLANG_URL_FILE: https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-12-link.txt
      KSU_REF: ${{ inputs.ksu_ref }}
      BUILD_JOBS: ${{ inputs.build_jobs }}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Prepare CI environment (no external Python scripts required)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs dist toolchains
          echo 'Single-file workflow; scripts/ folder is NOT required.'
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner workspace: $GITHUB_WORKSPACE"
          git rev-parse --short HEAD | tee build-logs/workflow-commit.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libssl-dev lz4 python3 rsync unzip zip zlib1g-dev

      - name: Checkout FirmanBell legacy kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          test -f "kernel/arch/arm64/configs/$DEFCONFIG"
          mkdir -p build-logs dist kernel/out
          git -C kernel rev-parse HEAD | tee build-logs/kernel-commit.txt

      - name: Download ZyCromerZ Clang 12.0.1 (GitHub Release with fallback)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p toolchains/clang12 build-logs /tmp/zyc12-release
          exec > >(tee build-logs/clang-download.log) 2>&1

          echo '=== Resolve official ZyCromerZ Clang 12 download pointer ==='
          echo "Pointer: $CLANG_URL_FILE"
          if ! curl -fLsS --retry 4 --retry-all-errors --retry-delay 4 \
             --connect-timeout 30 "$CLANG_URL_FILE" -o /tmp/zyc12-link.txt; then
            echo '::error::Cannot fetch official Clang-12-link.txt from ZyCromerZ.'
            exit 1
          fi
          CLANG_URL="$(sed -n '1{s/\r$//;p;}' /tmp/zyc12-link.txt)"
          if [[ ! "$CLANG_URL" =~ ^https://github\.com/ZyCromerZ/Clang/releases/download/([^/]+)/([^/?#]+\.tar\.(gz|xz))$ ]]; then
            echo "::error::Unexpected ZyCromerZ Clang 12 URL: $CLANG_URL"
            exit 1
          fi
          TAG="${BASH_REMATCH[1]}"
          ASSET="${BASH_REMATCH[2]}"
          [[ "$TAG" == *12* && "$ASSET" == Clang-12.* ]] || {
            echo "::error::Refusing non-Clang-12 archive: $TAG / $ASSET"
            exit 1
          }
          echo "Official release tag : $TAG"
          echo "Official release file: $ASSET"
          echo "Official download URL: $CLANG_URL"
          ARCHIVE="/tmp/zyc12-release/$ASSET"

          # gh release download uses the GitHub release assets API. If this method
          # fails, use the official URL in Clang-12-link.txt as fallback.
          if command -v gh >/dev/null 2>&1; then
            echo '=== Attempt 1: GitHub CLI release download ==='
            if gh release download "$TAG" \
                --repo ZyCromerZ/Clang --pattern "$ASSET" \
                --dir /tmp/zyc12-release; then
              echo '[OK] gh release download completed.'
            else
              echo '::warning::GitHub CLI could not download this asset. Trying curl.'
              rm -f "$ARCHIVE" # discard a partial asset, if any
            fi
          else
            echo '::warning::GitHub CLI not installed; using curl.'
          fi

          if [[ ! -s "$ARCHIVE" ]]; then
            echo '=== Attempt 2: direct official release URL via curl ==='
            rm -f "$ARCHIVE"
            if ! curl -fL --show-error --silent --retry 5 --retry-all-errors \
                --retry-delay 8 --connect-timeout 30 \
                --max-time 1500 --output "$ARCHIVE" \
                --write-out 'HTTP status: %{http_code}; downloaded bytes: %{size_download}\n' \
                "$CLANG_URL"; then
              echo "::error::Unable to download $ASSET through GitHub CLI or curl."
              echo '::error::Check the Clang-12-link.txt release asset and the HTTP errors above.'
              exit 1
            fi
          fi

          echo '=== Verify download and unpack ==='
          ls -lh "$ARCHIVE"
          BYTES="$(stat -c%s "$ARCHIVE")"
          if (( BYTES < 10485760 )); then
            echo "::error::Clang archive too small ($BYTES bytes); possibly error page or incomplete download."
            exit 1
          fi
          if ! tar -tf "$ARCHIVE" >/dev/null; then
            echo '::error::Downloaded archive failed tar integrity check.'
            exit 1
          fi
          tar -xf "$ARCHIVE" -C toolchains/clang12
          CLANG_BIN="$(find "$GITHUB_WORKSPACE/toolchains/clang12" -path '*/bin/clang' -print -quit)"
          if [[ -z "$CLANG_BIN" || ! -x "$CLANG_BIN" ]]; then
            echo '::error::No executable bin/clang found inside extracted archive.'
            find toolchains/clang12 -maxdepth 3 -type d -print | head -30
            exit 1
          fi
          TC_BIN="$(dirname "$CLANG_BIN")"
          if [[ ! -x "$TC_BIN/ld.lld" || ! -x "$TC_BIN/llvm-ar" ]]; then
            echo "::error::Required LLVM tools missing in $TC_BIN"
            ls -lah "$TC_BIN" | head -50
            exit 1
          fi
          "$TC_BIN/clang" --version | tee build-logs/clang-version.txt
          if ! grep -Eiq 'clang version 12\.' build-logs/clang-version.txt; then
            echo '::error::Downloaded compiler is NOT Clang 12. Check upstream release.'
            exit 1
          fi
          echo "$TC_BIN" >> "$GITHUB_PATH"
          echo "Clang 12 ready: $TC_BIN"

      - name: Download Android GCC 4.9 toolchains (LineageOS with AOSP fallback)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p toolchains build-logs
          exec > >(tee build-logs/gcc-download.log) 2>&1

          # AOSP main no longer necessarily contains the old GCC binaries.
          # LineageOS lineage-19.1 and Android 10 r40 retain GCC 4.9 prebuilts.
          fetch_gcc() {
            local arch="$1" dest="$2" required="$3" lineage_repo="$4" aosp_repo="$5"
            local source url ref attempt

            for source in LineageOS AOSP; do
              if [[ "$source" == LineageOS ]]; then
                url="https://github.com/LineageOS/${lineage_repo}.git"
                ref="lineage-19.1"
              else
                url="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/${aosp_repo}"
                ref="android-10.0.0_r40"
              fi

              for attempt in 1 2; do
                echo "=== [$arch] $source attempt $attempt: $url (ref $ref) ==="
                rm -rf "$dest"
                # Ensure git failures (network, HTTP, missing branch) are
                # included in gcc-download.log and do not hide the fallback.
                if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 \
                    clone --depth=1 --single-branch --branch "$ref" \
                    "$url" "$dest"; then
                  if [[ -x "$dest/bin/$required" ]]; then
                    echo "[OK] $arch $required is present and executable"
                    git -C "$dest" rev-parse HEAD
                    return 0
                  else
                    echo "::warning::$source clone for $arch completed, but bin/$required is missing"
                    ls -la "$dest/bin/" 2>/dev/null | head -30 || true
                  fi
                else
                  echo "::warning::$source clone failed for $arch (attempt $attempt)"
                fi
              done
            done

            echo "::error::Android GCC 4.9 $arch could not be fetched. See build-logs/gcc-download.log"
            rm -rf "$dest"
            return 1
          }

          fetch_gcc arm64 toolchains/gcc64 aarch64-linux-android-as \
            android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            aarch64/aarch64-linux-android-4.9
          fetch_gcc arm32 toolchains/gcc32 arm-linux-androideabi-gcc \
            android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            arm/arm-linux-androideabi-4.9

          echo '=== Check GCC 4.9 binaries ==='
          for tool in \
            toolchains/gcc64/bin/aarch64-linux-android-as \
            toolchains/gcc64/bin/aarch64-linux-android-elfedit \
            toolchains/gcc32/bin/arm-linux-androideabi-gcc; do
            if [[ ! -x "$tool" ]]; then
              echo "::error::Missing required tool: $tool"
              exit 1
            fi
            echo "[OK] $tool"
          done
          toolchains/gcc32/bin/arm-linux-androideabi-gcc --version | head -1
          toolchains/gcc64/bin/aarch64-linux-android-as --version | head -1
          {
            echo 'GCC64:'
            git -C toolchains/gcc64 rev-parse HEAD
            echo 'GCC32:'
            git -C toolchains/gcc32 rev-parse HEAD
          } > build-logs/gcc-commits.txt
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"
          echo '[OK] Android GCC 4.9 toolchains ready; Clang 12 stays the kernel C compiler'

      - name: Integrate KernelSU Next legacy manual hooks
        shell: bash
        run: |
          set -euo pipefail
          # 'legacy' is the non-GKI branch. For a SHA, fetch that commit explicitly.
          if [[ "$KSU_REF" == "legacy" ]]; then
            git clone --single-branch --branch legacy --depth=1 \
              https://github.com/KernelSU-Next/KernelSU-Next.git kernel/KernelSU-Next
          elif [[ "$KSU_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git clone --filter=blob:none --no-checkout \
              https://github.com/KernelSU-Next/KernelSU-Next.git kernel/KernelSU-Next
            git -C kernel/KernelSU-Next checkout "$KSU_REF"
          else
            echo "ksu_ref must be legacy or a full 40-digit commit SHA" >&2
            exit 1
          fi
          git -C kernel/KernelSU-Next rev-parse HEAD | tee build-logs/ksu-commit.txt
          # The following Python sources are EMBEDDED in this workflow to fix
          # GitHub uploads that omit scripts/apply_legacy_hooks.py.
          python3 - kernel <<'KSUN_INTEGRATE_PY'
          #!/usr/bin/env python3
          """Integrate a checked-out KernelSU Next legacy tree into a Linux kernel.
          
          Run from the CI working directory after cloning kernel/KernelSU-Next.
          Only changes drivers/Kconfig, drivers/Makefile, drivers/kernelsu symlink.
          """
          import os
          from pathlib import Path
          import sys
          
          
          def integrate(kernel: Path) -> None:
              kernel = kernel.resolve()
              drivers = kernel / 'drivers'
              ksu = kernel / 'KernelSU-Next' / 'kernel'
              target = drivers / 'kernelsu'
              mk = drivers / 'Makefile'
              cfg = drivers / 'Kconfig'
              for check in (drivers, mk, cfg, ksu / 'Kconfig', ksu / 'Kbuild',
                            kernel / 'arch/arm64/configs/platina_defconfig'):
                  if not check.exists():
                      raise RuntimeError(f'Missing required kernel file: {check}')
          
              if target.is_symlink():
                  if target.resolve() != ksu.resolve():
                      raise RuntimeError(f'Existing kernelsu link points elsewhere: {target}')
              elif target.exists():
                  raise RuntimeError(f'Refusing to overwrite existing kernelsu path: {target}')
              else:
                  target.symlink_to(os.path.relpath(ksu, drivers), target_is_directory=True)
          
              makeline = 'obj-$(CONFIG_KSU) += kernelsu/'
              data = mk.read_text()
              if data.count(makeline) > 1:
                  raise RuntimeError('drivers/Makefile contains duplicate KernelSU entries')
              if makeline not in data:
                  mk.write_text(data.rstrip('\n') + '\n' + makeline + '\n')
          
              line = 'source "drivers/kernelsu/Kconfig"'
              data = cfg.read_text()
              if data.count(line) > 1:
                  raise RuntimeError('drivers/Kconfig contains duplicate KernelSU entries')
              if line not in data:
                  # Scope to the last *top-level* endmenu, avoiding sed's global insertion.
                  marker = '\nendmenu'
                  pos = data.rfind(marker)
                  if pos == -1:
                      raise RuntimeError('drivers/Kconfig: closing endmenu not found')
                  cfg.write_text(data[:pos] + '\n' + line + '\n' + data[pos:])
              assert mk.read_text().count(makeline) == 1
              assert cfg.read_text().count(line) == 1
              print('[OK] KernelSU Next legacy linked exactly once')
          
          
          if __name__ == '__main__':
              try:
                  integrate(Path(sys.argv[1] if len(sys.argv) == 2 else 'kernel'))
              except (RuntimeError, OSError) as e:
                  print('ERROR:', e, file=sys.stderr)
                  sys.exit(1)
          KSUN_INTEGRATE_PY
          python3 - kernel <<'KSUN_HOOK_PY'
          #!/usr/bin/env python3
          """Apply KernelSU-Next legacy manual syscall hooks to FirmanBell/msm-4.4:legacy.
          
          Based on the KernelSU Next non-GKI manual hook integration guide.
          Fails closed when source lines differ from the reviewed kernel revision.
          """
          from pathlib import Path
          import sys
          
          
          def replace_once(path: Path, old: str, new: str) -> None:
              body = path.read_text()
              count = body.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact anchor, found {count}: {old[:100]!r}")
              path.write_text(body.replace(old, new, 1))
              print(f"[OK] patched {path}")
          
          
          def main(root: Path) -> None:
              if not (root / "arch/arm64/configs/platina_defconfig").is_file():
                  raise RuntimeError("This script requires a kernel tree with platina_defconfig")
              targets = ["fs/exec.c", "fs/open.c", "fs/read_write.c", "fs/stat.c", "kernel/reboot.c"]
              for rel in targets:
                  if "ksu_handle_" in (root / rel).read_text():
                      raise RuntimeError(f"{rel} already contains KernelSU hooks: do not inject twice")
          
              p = root / "fs/exec.c"
              replace_once(p, "int do_execve(struct filename *filename,\n",
                           "#ifdef CONFIG_KSU\n"
                           "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                           "\t\t\t      void *argv, void *envp, int *flags);\n"
                           "#endif\n\n"
                           "int do_execve(struct filename *filename,\n")
              replace_once(p,
                           "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
                           "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
                           "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
                           "#ifdef CONFIG_KSU\n"
                           "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n"
                           "#endif\n"
                           "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);")
              # After replacing the native call, the remaining identical return is compat_do_execve().
              replace_once(p,
                           "\t\t.ptr.compat = __envp,\n\t};\n"
                           "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
                           "\t\t.ptr.compat = __envp,\n\t};\n"
                           "#ifdef CONFIG_KSU\n"
                           "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n"
                           "#endif\n"
                           "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);")
          
              p = root / "fs/open.c"
              replace_once(p,
                           "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
                           "#ifdef CONFIG_KSU\n"
                           "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                           "\t\t\t      int *mode, int *flags);\n"
                           "#endif\n\n"
                           "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)")
              replace_once(p,
                           "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\tif (mode & ~S_IRWXO)",
                           "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
                           "#ifdef CONFIG_KSU\n"
                           "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                           "#endif\n"
                           "\tif (mode & ~S_IRWXO)")
          
              p = root / "fs/read_write.c"
              replace_once(p,
                           "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)",
                           "#ifdef CONFIG_KSU\n"
                           "extern bool ksu_vfs_read_hook __read_mostly;\n"
                           "extern int ksu_handle_sys_read(unsigned int fd,\n"
                           "\t\t\t    char __user **buf_ptr, size_t *count_ptr);\n"
                           "#endif\n\n"
                           "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)")
              replace_once(p,
                           "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n"
                           "{\n\tstruct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;",
                           "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n"
                           "{\n\tstruct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;\n"
                           "#ifdef CONFIG_KSU\n"
                           "\tif (unlikely(ksu_vfs_read_hook))\n"
                           "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                           "#endif")
          
              p = root / "fs/stat.c"
              replace_once(p,
                           "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,",
                           "#ifdef CONFIG_KSU\n"
                           "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                           "\t\t\t   int *flags);\n"
                           "#endif\n\n"
                           "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,")
              replace_once(p,
                           "\t\tstruct stat __user *, statbuf, int, flag)\n"
                           "{\n\tstruct kstat stat;\n\tint error;\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);",
                           "\t\tstruct stat __user *, statbuf, int, flag)\n"
                           "{\n\tstruct kstat stat;\n\tint error;\n\n"
                           "#ifdef CONFIG_KSU\n"
                           "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                           "#endif\n"
                           "\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          
              p = root / "kernel/reboot.c"
              replace_once(p,
                           "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
                           "#ifdef CONFIG_KSU\n"
                           "extern int ksu_handle_sys_reboot(int magic1, int magic2,\n"
                           "\t\t\t      unsigned int cmd, void __user **arg);\n"
                           "#endif\n\n"
                           "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,")
              replace_once(p,
                           "\tchar buffer[256];\n\tint ret = 0;",
                           "\tchar buffer[256];\n\tint ret = 0;\n"
                           "#ifdef CONFIG_KSU\n"
                           "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                           "#endif")
          
              for rel in targets:
                  assert "ksu_handle_" in (root / rel).read_text(), f"Missing manual hook in {rel}"
              print("[OK] All five KernelSU Next legacy manual hook locations patched")
          
          
          if __name__ == "__main__":
              try:
                  main(Path(sys.argv[1]).resolve() if len(sys.argv) > 1 else Path.cwd())
              except (RuntimeError, OSError) as exc:
                  print(f"ERROR: {exc}", file=sys.stderr)
                  sys.exit(1)
          KSUN_HOOK_PY
          test -f kernel/drivers/kernelsu/Kbuild
          grep -q 'ksu_handle_sys_reboot' kernel/kernel/reboot.c
          echo 'All 5 manual hook locations patched.'

      - name: Generate platina_defconfig and verify manual hook settings
        shell: bash
        run: |
          set -euo pipefail
          # Clang is first on PATH; Android GCC 4.9 provides external assembler
          # and 32-bit compat utilities required by this 4.4 Makefile.
          make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
            CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- \
            "$DEFCONFIG" 2>&1 | tee build-logs/config.log
          # The official manual-hook guide requires CONFIG_KSU=y.
          # Do not force KPROBES off: other kernel features may depend on it.
          kernel/scripts/config --file kernel/out/.config \
            -e KSU -d KSU_DEBUG -d KSU_KPROBES_HOOK -d KSU_KPROBE_HOOKS \
            -d KSU_SYSCALL_TABLE_HOOK
          if grep -Eq '^[[:space:]]*config KSU_MANUAL_HOOK' kernel/KernelSU-Next/kernel/Kconfig; then
            kernel/scripts/config --file kernel/out/.config -e KSU_MANUAL_HOOK
          fi
          make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
            CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig 2>&1 | tee -a build-logs/config.log
          grep -qx 'CONFIG_KSU=y' kernel/out/.config
          echo '[OK] CONFIG_KSU=y; KernelSU manual syscall hooks integrated'
          grep -E '^CONFIG_KSU|^# CONFIG_KSU' kernel/out/.config | tee build-logs/ksu-config.txt

      - name: Compile kernel using Clang 12
        shell: bash
        run: |
          set -euo pipefail
          make -C kernel -j"$BUILD_JOBS" O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
            CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb dtbs 2>&1 | tee build-logs/build.log
          if [[ ! -s kernel/out/arch/arm64/boot/Image.gz-dtb ]]; then
            echo 'ERROR: Image.gz-dtb absent. Check CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE and build.log.' >&2
            ls -lah kernel/out/arch/arm64/boot/ || true
            exit 1
          fi

      - name: Package kernel files and checksums (not flashable)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp kernel/out/arch/arm64/boot/Image.gz-dtb dist/Image.gz-dtb
          cp kernel/out/.config dist/platina.config
          cp build-logs/{kernel-commit.txt,ksu-commit.txt,clang-version.txt} dist/
          ( cd dist && sha256sum Image.gz-dtb > SHA256SUMS )
          zip -q -r "platina-ksunext-clang12-run${GITHUB_RUN_NUMBER}-NOT-FLASHABLE.zip" dist
          {
            echo '### Platina KernelSU Next build'
            echo "- Kernel: FirmanBell/msm-4.4 ($KERNEL_BRANCH)"
            echo "- Defconfig: $DEFCONFIG"
            echo "- Compiler: $(head -n 1 build-logs/clang-version.txt)"
            echo "- KernelSU ref: $(cat build-logs/ksu-commit.txt)"
            echo '- Hook mode: manual (no kprobes)'
            echo '- Output: Image.gz-dtb (NOT directly flashable)'
          } | tee build-logs/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel, config and logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platina-ksunext-clang12-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/
            platina-ksunext-clang12-run*-NOT-FLASHABLE.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/System.map
            kernel/out/.config
