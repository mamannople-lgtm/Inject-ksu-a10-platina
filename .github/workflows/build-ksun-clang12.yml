    - name: Generate platina_defconfig and verify manual hook settings
      shell: bash
      run: |
        set -euo pipefail
        # Clang is first on PATH; Android GCC 4.9 provides external assembler
        # and 32-bit compat utilities required by this 4.4 Makefile.
        make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- \
          "$DEFCONFIG" 2>&1 | tee build-logs/config.log
        # The official manual-hook guide requires CONFIG_KSU=y.
        # Do not force KPROBES off: other kernel features may depend on it.
        kernel/scripts/config --file kernel/out/.config \
          -e KSU -d KSU_DEBUG -d KSU_KPROBES_HOOK -d KSU_KPROBE_HOOKS \
          -d KSU_SYSCALL_TABLE_HOOK -d LTO -d LTO_CLANG -d THINLTO -e LTO_NONE
        kernel/scripts/config --file kernel/out/.config --set-str LOCALVERSION '-Deliya+' -d LOCALVERSION_AUTO
        if grep -Eq '^[[:space:]]*config KSU_MANUAL_HOOK' kernel/KernelSU-Next/kernel/Kconfig; then
          kernel/scripts/config --file kernel/out/.config -e KSU_MANUAL_HOOK
        fi
        make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- \
          olddefconfig 2>&1 | tee -a build-logs/config.log
        grep -qx 'CONFIG_KSU=y' kernel/out/.config
        echo '[OK] CONFIG_KSU=y; KernelSU manual syscall hooks integrated'
        grep -E '^CONFIG_KSU|^# CONFIG_KSU' kernel/out/.config | tee build-logs/ksu-config.txt
        grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' kernel/out/.config
        grep -qx 'CONFIG_LTO_NONE=y' kernel/out/.config
        grep -qx 'CONFIG_LOCALVERSION="-Deliya+"' kernel/out/.config
        grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' kernel/out/.config
    - name: Compile SELinux, KernelSU Next, and the complete kernel
      shell: bash
      run: |
        set -euo pipefail
        args=( -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
          CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          CLANG_TRIPLE=aarch64-linux-gnu- )
        # Build SELinux generated headers before KSU includes avc.h.
        make "${args[@]}" -j"$BUILD_JOBS" security/selinux/ 2>&1 | tee build-logs/selinux.log
        make "${args[@]}" -j"$BUILD_JOBS" drivers/kernelsu/ 2>&1 | tee build-logs/ksu-objects.log

        # Verify that no KernelSU object (except kernel_compat.o) calls raw Linux 4.4 kernel_read/kernel_write
        for obj in $(find kernel/out/drivers/kernelsu -name '*.o' ! -name 'kernel_compat.o' ! -name 'kernelsu.o' ! -name 'built-in.o'); do
          if llvm-nm -u "$obj" | grep -Eq '[[:space:]](kernel_read|kernel_write)$'; then
            echo "ERROR: $obj still references raw Linux 4.4 kernel_read/kernel_write instead of ksu_kernel_*_compat!" >&2
            exit 1
          fi
        done
        llvm-nm -u kernel/out/drivers/kernelsu/manager/apk_sign.o | grep -Eq '[[:space:]]ksu_kernel_read_compat$'
        llvm-nm -u kernel/out/drivers/kernelsu/manager/throne_tracker.o | grep -Eq '[[:space:]]ksu_kernel_read_compat$'
        echo '[OK] Verified apk_sign.o and throne_tracker.o use ksu_kernel_read_compat'

        make "${args[@]}" -j"$BUILD_JOBS" Image.gz-dtb dtbs 2>&1 | tee build-logs/build.log
        test -s kernel/out/arch/arm64/boot/Image.gz-dtb
        test -s kernel/out/vmlinux
        llvm-nm --defined-only kernel/out/vmlinux > build-logs/vmlinux-symbols.txt
        for sym in kernelsu_init ksu_handle_execveat ksu_handle_sys_read ksu_handle_sys_reboot ksu_handle_fstat64_ret ksu_kernel_read_compat; do
          grep -Eq "[[:space:]]${sym}$" build-logs/vmlinux-symbols.txt
        done
        grep -qx '#define LINUX_COMPILE_BY "LocalEmpty"' kernel/out/include/generated/compile.h
        grep -qx '#define LINUX_COMPILE_HOST "LocalEmpty"' kernel/out/include/generated/compile.h
        grep -qx '4.4.228-Deliya+' kernel/out/include/config/kernel.release
        cp kernel/out/include/generated/compile.h build-logs/compile.h
        cp kernel/out/include/config/kernel.release build-logs/kernel.release
    - name: Package AnyKernel3 flashable ZIP and raw kernel files
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        cp kernel/out/arch/arm64/boot/Image.gz-dtb dist/Image.gz-dtb
        cp kernel/out/.config dist/platina.config
        cp build-logs/{kernel-commit.txt,ksu-commit.txt,clang-version.txt,ksu-compat.patch,kernel-changes.patch} dist/

        # Package a ready-to-flash AnyKernel3 ZIP for Xiaomi Mi 8 Lite (platina)
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        rm -rf AnyKernel3/.git AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        cat > AnyKernel3/anykernel.sh <<'AK3_SH'
        ### AnyKernel3 Ramdisk Mod Script
        ## osm0sis @ xda-developers
        properties() { '
        kernel.string=-Deliya+ Platina KernelSU-Next legacy 33314 (Clang 12)
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=platina
        device.name2=MI 8 Lite
        device.name3=Xiaomi Mi 8 Lite
        supported.versions=
        supported.patchlevels=
        '; }

        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        . tools/ak3-core.sh;

        dump_boot;
        write_boot;
        AK3_SH
        (
          cd AnyKernel3
          zip -q -r9 "$GITHUB_WORKSPACE/dist/platina-Deliya-plus-ksunext33314-AnyKernel3.zip" . -x '*.git*' 'README.md' '*placeholder*'
        )
        (
          cd dist
          sha256sum Image.gz-dtb platina-Deliya-plus-ksunext33314-AnyKernel3.zip > SHA256SUMS
        )
        {
          echo '### Platina KernelSU Next build'
          echo "- Kernel: FirmanBell/msm-4.4 ($KERNEL_BRANCH)"
          echo "- Defconfig: $DEFCONFIG"
          echo "- Compiler: $(head -n 1 build-logs/clang-version.txt)"
          echo "- KernelSU ref: $(cat build-logs/ksu-commit.txt) (v3.4.0-legacy-20-g465490a2 / 33314)"
          echo '- Hook mode: manual (execveat, faccessat, read, stat/newfstat/fstat64, reboot supercall, input safe-mode)'
          echo '- Linux 4.4 file I/O compat: applied across all KernelSU modules (including apk_sign.c & throne_tracker.c)'
          echo '- Output: AnyKernel3 flashable ZIP + raw Image.gz-dtb'
        } | tee build-logs/summary.txt >> "$GITHUB_STEP_SUMMARY"
    - name: Summarize first build error (when failed)
      if: failure()
      shell: bash
      run: "set -uo pipefail\nmkdir -p build-logs\nfor log in build-logs/build.log build-logs/ksu-objects.log build-logs/selinux.log;\
        \ do\n  if [[ -s \"$log\" ]] && grep -Eiq 'fatal error:|error:|undefined reference|Error [0-9]+' \"$log\"; then\n\
        \    cp \"$log\" build-logs/failure.log\n    break\n  fi\ndone\nif [[ -s build-logs/failure.log ]]; then\n  echo '===\
        \ First relevant compiler and linker errors ==='\n  grep -Enim 20 'fatal error:|(^|[[:space:]])error:|undefined reference|No\
        \ rule to make target|ld.lld: error:|clang: error:' \\\n    build-logs/failure.log | tee build-logs/first-errors.txt\
        \ || true\n  first_line=\"$(grep -Enim 1 'fatal error:|(^|[[:space:]])error:|undefined reference|No rule to make target|ld.lld:\
        \ error:|clang: error:' \\\n    build-logs/failure.log | cut -d: -f1 || true)\"\n  if [[ -n \"$first_line\" ]]; then\n\
        \    start=$(( first_line > 8 ? first_line - 8 : 1 ))\n    end=$(( first_line + 22 ))\n    echo '=== Context of first\
        \ error ==='\n    sed -n \"${start},${end}p\" build-logs/failure.log | tee build-logs/first-error-context.txt\n  \
        \  {\n      echo '### Kernel build failed \u2014 first diagnostic'\n      echo '```text'\n      cat build-logs/first-error-context.txt\n\
        \      echo '```'\n    } >> \"$GITHUB_STEP_SUMMARY\"\n  else\n    echo 'No compiler/linker error token found in build.log.'\
        \ | tee build-logs/first-errors.txt\n  fi\nelse\n  echo 'Build log was not created; failure occurred before kernel\
        \ compilation.' | tee build-logs/first-errors.txt\nfi\n"
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: platina-ksunext-clang12-logs-${{ github.run_number }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          build-logs/
          kernel/out/.config
    - name: Upload compiled kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: platina-ksunext-clang12-kernel-${{ github.run_number }}
        if-no-files-found: error
        retention-days: 14
        path: |
          dist/
'on':
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Number of parallel jobs (2 recommended for GitHub-hosted runners)
        required: true
        default: '2'
        type: choice
        options:
        - '1'
        - '2'
        - '3'
        - '4'
