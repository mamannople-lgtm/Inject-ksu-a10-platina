    - name: Fix Manager detection file I/O on Linux 4.4
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'MANAGER_IO_PY'
        from pathlib import Path
        import re
        root = Path('kernel/KernelSU-Next/kernel')
        for rel in ('manager/apk_sign.c', 'manager/throne_tracker.c'):
            p = root / rel
            source = p.read_text()
            # Both files contain two actual reads; do not count comments.
            calls = [line for line in source.splitlines() if 'kernel_read(' in line and not line.lstrip().startswith('//')]
            assert len(calls) == 2, (rel, len(calls))
            source = re.sub(r'\bkernel_read\(', 'ksu_kernel_read_compat(', source)
            if '#include "compat/kernel_compat.h"' not in source:
                source = '#include "compat/kernel_compat.h"\n' + source
            p.write_text(source)
            print('[MANAGER_IO]', rel, 'uses legacy-safe reads with advancing offsets')
        MANAGER_IO_PY
        git -C kernel/KernelSU-Next diff > build-logs/ksu-compat.patch
    - name: Generate platina_defconfig and verify manual hook settings
      shell: bash
      run: |
        set -euo pipefail
        # Clang is first on PATH; Android GCC 4.9 provides external assembler
        # and 32-bit compat utilities required by this 4.4 Makefile.
        make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- \
          "$DEFCONFIG" 2>&1 | tee build-logs/config.log
        # The official manual-hook guide requires CONFIG_KSU=y.
        # Do not force KPROBES off: other kernel features may depend on it.
        kernel/scripts/config --file kernel/out/.config \
          -e KSU -d KSU_DEBUG -d KSU_KPROBES_HOOK -d KSU_KPROBE_HOOKS \
          -d KSU_SYSCALL_TABLE_HOOK -d LTO -d LTO_CLANG -d THINLTO -e LTO_NONE
        if grep -Eq '^[[:space:]]*config KSU_MANUAL_HOOK' kernel/KernelSU-Next/kernel/Kconfig; then
          kernel/scripts/config --file kernel/out/.config -e KSU_MANUAL_HOOK
        fi
        make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64 \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- \
          olddefconfig 2>&1 | tee -a build-logs/config.log
        grep -qx 'CONFIG_KSU=y' kernel/out/.config
        echo '[OK] CONFIG_KSU=y; KernelSU manual syscall hooks integrated'
        grep -E '^CONFIG_KSU|^# CONFIG_KSU' kernel/out/.config | tee build-logs/ksu-config.txt
        grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' kernel/out/.config
        grep -qx 'CONFIG_LTO_NONE=y' kernel/out/.config
    - name: Compile SELinux, KernelSU Next, and the complete kernel
      shell: bash
      run: |
        set -euo pipefail
        args=( -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64   CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump   CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-   CLANG_TRIPLE=aarch64-linux-gnu- )
        # Build SELinux generated headers before KSU includes avc.h.
        make "${args[@]}" -j"$BUILD_JOBS" security/selinux/ 2>&1 | tee build-logs/selinux.log
        make "${args[@]}" -j"$BUILD_JOBS" drivers/kernelsu/ 2>&1 | tee build-logs/ksu-objects.log
        make "${args[@]}" -j"$BUILD_JOBS" Image.gz-dtb dtbs 2>&1 | tee build-logs/build.log
        test -s kernel/out/arch/arm64/boot/Image.gz-dtb
        test -s kernel/out/vmlinux
        llvm-nm --defined-only kernel/out/vmlinux > build-logs/vmlinux-symbols.txt
        for sym in kernelsu_init ksu_handle_execveat ksu_handle_sys_read ksu_handle_sys_reboot; do
          grep -Eq "[[:space:]]${sym}$" build-logs/vmlinux-symbols.txt
        done
    - name: Package kernel files and checksums (not flashable)
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        cp kernel/out/arch/arm64/boot/Image.gz-dtb dist/Image.gz-dtb
        cp kernel/out/.config dist/platina.config
        cp build-logs/{kernel-commit.txt,ksu-commit.txt,clang-version.txt} dist/
        ( cd dist && sha256sum Image.gz-dtb > SHA256SUMS )
        zip -q -r "platina-ksunext-clang12-run${GITHUB_RUN_NUMBER}-NOT-FLASHABLE.zip" dist
        {
          echo '### Platina KernelSU Next build'
          echo "- Kernel: FirmanBell/msm-4.4 ($KERNEL_BRANCH)"
          echo "- Defconfig: $DEFCONFIG"
          echo "- Compiler: $(head -n 1 build-logs/clang-version.txt)"
          echo "- KernelSU ref: $(cat build-logs/ksu-commit.txt)"
          echo '- Hook mode: manual; 64-bit and compat exec; safe-mode input hook'
          echo '- Output: Image.gz-dtb (NOT directly flashable)'
        } | tee build-logs/summary.txt >> "$GITHUB_STEP_SUMMARY"
    - name: Summarize first build error (when failed)
      if: failure()
      shell: bash
      run: "set -uo pipefail\nmkdir -p build-logs\nfor log in build-logs/build.log build-logs/ksu-objects.log build-logs/selinux.log;\
        \ do\n  if [[ -s \"$log\" ]] && grep -Eiq 'fatal error:|error:|undefined reference|Error [0-9]+' \"$log\"\
        ; then\n    cp \"$log\" build-logs/failure.log\n    break\n  fi\ndone\nif [[ -s build-logs/failure.log ]];\
        \ then\n  echo '=== First relevant compiler and linker errors ==='\n  grep -Enim 20 'fatal error:|(^|[[:space:]])error:|undefined\
        \ reference|No rule to make target|ld.lld: error:|clang: error:' \\\n    build-logs/failure.log | tee build-logs/first-errors.txt\
        \ || true\n  first_line=\"$(grep -Enim 1 'fatal error:|(^|[[:space:]])error:|undefined reference|No rule\
        \ to make target|ld.lld: error:|clang: error:' \\\n    build-logs/failure.log | cut -d: -f1 || true)\"\n\
        \  if [[ -n \"$first_line\" ]]; then\n    start=$(( first_line > 8 ? first_line - 8 : 1 ))\n    end=$((\
        \ first_line + 22 ))\n    echo '=== Context of first error ==='\n    sed -n \"${start},${end}p\" build-logs/failure.log\
        \ | tee build-logs/first-error-context.txt\n    {\n      echo '### Kernel build failed \u2014 first diagnostic'\n\
        \      echo '```text'\n      cat build-logs/first-error-context.txt\n      echo '```'\n    } >> \"$GITHUB_STEP_SUMMARY\"\
        \n  else\n    echo 'No compiler/linker error token found in build.log.' | tee build-logs/first-errors.txt\n\
        \  fi\nelse\n  echo 'Build log was not created; failure occurred before kernel compilation.' | tee build-logs/first-errors.txt\n\
        fi\n"
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: platina-ksunext-clang12-logs-${{ github.run_number }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          build-logs/
          kernel/out/.config
    - name: Upload compiled kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: platina-ksunext-clang12-kernel-${{ github.run_number }}
        if-no-files-found: error
        retention-days: 14
        path: |
          dist/
'on':
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Number of parallel jobs (2 recommended for GitHub-hosted runners)
        required: true
        default: '2'
        type: choice
        options:
        - '1'
        - '2'
        - '3'
        - '4'
