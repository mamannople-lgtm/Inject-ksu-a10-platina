name: Platina KernelSU Next | Clang 12 | pinned build
permissions:
  contents: read
concurrency:
  group: platina-ksun-clang12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: ISAL
      KBUILD_BUILD_HOST: LocalEmpty
      KERNEL_REPO: https://github.com/FirmanBell/msm-4.4.git
      KERNEL_BRANCH: legacy
      DEFCONFIG: platina_defconfig
      KSU_REF: 3ade559d798d76870c35a62267c06112b5524379
      BUILD_JOBS: ${{ inputs.build_jobs }}
      KERNEL_COMMIT: 4af53b46cc9ecb8e31de299e1d6044210a297590
      CLANG_SHA256: 2453486456a5ddbed677bccb1dba70a04cbd3c7dfe8947dcb9a83525a20a4adf
    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4
    - name: Prepare CI environment (no external Python scripts required)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build-logs dist toolchains
        echo 'Single-file workflow; scripts/ folder is NOT required.'
        echo "Repository: $GITHUB_REPOSITORY"
        echo "Runner workspace: $GITHUB_WORKSPACE"
        git rev-parse --short HEAD | tee build-logs/workflow-commit.txt
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates curl flex git \
          libelf-dev libssl-dev lz4 python3 rsync unzip zip zlib1g-dev
    - name: Checkout FirmanBell legacy kernel
      shell: bash
      run: |
        set -euo pipefail
        git init kernel
        git -C kernel remote add origin "$KERNEL_REPO"
        git -C kernel fetch --depth=1 origin "$KERNEL_COMMIT"
        git -C kernel checkout --detach FETCH_HEAD
        test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_COMMIT"
        test -f "kernel/arch/arm64/configs/$DEFCONFIG"
        mkdir -p build-logs dist kernel/out
        git -C kernel rev-parse HEAD | tee build-logs/kernel-commit.txt
    - name: Download and verify pinned ZyCromerZ Clang 12.0.1
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p toolchains/clang12 build-logs
        exec > >(tee build-logs/clang-download.log) 2>&1
        curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1500   https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz   -o toolchains/clang12.tar.gz
        printf '%s  %s\n' "$CLANG_SHA256" toolchains/clang12.tar.gz | sha256sum -c -
        tar -xf toolchains/clang12.tar.gz -C toolchains/clang12
        test -x toolchains/clang12/bin/clang
        test -x toolchains/clang12/bin/ld.lld
        toolchains/clang12/bin/clang --version | tee build-logs/clang-version.txt
        grep -q 'clang version 12.0.1' build-logs/clang-version.txt
        echo "$GITHUB_WORKSPACE/toolchains/clang12/bin" >> "$GITHUB_PATH"
    - name: Checkout pinned Android GCC 4.9 toolchains
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p toolchains build-logs
        exec > >(tee build-logs/gcc-download.log) 2>&1
        fetch_toolchain() {
          local repo="$1" dest="$2" commit="$3"
          git init "$dest"
          git -C "$dest" remote add origin "https://github.com/LineageOS/$repo.git"
          git -C "$dest" fetch --depth=1 origin "$commit"
          git -C "$dest" checkout --detach FETCH_HEAD
          test "$(git -C "$dest" rev-parse HEAD)" = "$commit"
        }
        fetch_toolchain android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9   toolchains/gcc64 5e030eafe024784a73cdf47e6936ac0dbfc763dc
        fetch_toolchain android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9   toolchains/gcc32 111258a10e017f067b27e6cfcea7619d753f3309
        # LineageOS GCC wrappers use /usr/bin/python; adapt the shebang to Python 3.
        python3 - <<'GCC_WRAPPER_PY'
        from pathlib import Path
        for root in (Path('toolchains/gcc64/bin'), Path('toolchains/gcc32/bin')):
            for p in root.iterdir():
                if not p.is_file():
                    continue
                with p.open('rb') as f:
                    first = f.readline(100)
                if first == b'#!/usr/bin/python\n':
                    p.write_bytes(p.read_bytes().replace(first, b'#!/usr/bin/env python3\n', 1))
        GCC_WRAPPER_PY
        toolchains/gcc64/bin/aarch64-linux-android-gcc --version | tee build-logs/gcc64-version.txt
        toolchains/gcc32/bin/arm-linux-androideabi-gcc --version | tee build-logs/gcc32-version.txt
        for tool in toolchains/gcc64/bin/aarch64-linux-android-as             toolchains/gcc64/bin/aarch64-linux-android-elfedit             toolchains/gcc32/bin/arm-linux-androideabi-gcc; do
          test -x "$tool"
        done
        {
          git -C toolchains/gcc64 rev-parse HEAD
          git -C toolchains/gcc32 rev-parse HEAD
        } | tee build-logs/gcc-commits.txt
        echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"
    - name: Integrate pinned KernelSU Next and Linux 4.4 backports
      shell: bash
      run: "set -euo pipefail\nmkdir -p build-logs\nexec > >(tee build-logs/ksu-hooks.log) 2>&1\ngit clone https://github.com/KernelSU-Next/KernelSU-Next.git\
        \ kernel/KernelSU-Next\ngit -C kernel/KernelSU-Next checkout --detach \"$KSU_REF\"\ntest \"$(git -C kernel/KernelSU-Next\
        \ rev-parse HEAD)\" = \"$KSU_REF\"\ngit -C kernel/KernelSU-Next rev-parse HEAD | tee build-logs/ksu-commit.txt\n\
        python3 - kernel <<'INTEGRATE_PY'\n#!/usr/bin/env python3\n\"\"\"Integrate a checked-out KernelSU Next legacy\
        \ tree into a Linux kernel.\n\nRun from the CI working directory after cloning kernel/KernelSU-Next.\nOnly\
        \ changes drivers/Kconfig, drivers/Makefile, drivers/kernelsu symlink.\n\"\"\"\nimport os\nfrom pathlib\
        \ import Path\nimport sys\n\n\ndef integrate(kernel: Path) -> None:\n    kernel = kernel.resolve()\n   \
        \ drivers = kernel / 'drivers'\n    ksu = kernel / 'KernelSU-Next' / 'kernel'\n    target = drivers / 'kernelsu'\n\
        \    mk = drivers / 'Makefile'\n    cfg = drivers / 'Kconfig'\n    for check in (drivers, mk, cfg, ksu /\
        \ 'Kconfig', ksu / 'Kbuild',\n                  kernel / 'arch/arm64/configs/platina_defconfig'):\n    \
        \    if not check.exists():\n            raise RuntimeError(f'Missing required kernel file: {check}')\n\n\
        \    if target.is_symlink():\n        if target.resolve() != ksu.resolve():\n            raise RuntimeError(f'Existing\
        \ kernelsu link points elsewhere: {target}')\n    elif target.exists():\n        raise RuntimeError(f'Refusing\
        \ to overwrite existing kernelsu path: {target}')\n    else:\n        target.symlink_to(os.path.relpath(ksu,\
        \ drivers), target_is_directory=True)\n\n    makeline = 'obj-$(CONFIG_KSU) += kernelsu/'\n    data = mk.read_text()\n\
        \    if data.count(makeline) > 1:\n        raise RuntimeError('drivers/Makefile contains duplicate KernelSU\
        \ entries')\n    if makeline not in data:\n        mk.write_text(data.rstrip('\\n') + '\\n' + makeline +\
        \ '\\n')\n\n    line = 'source \"drivers/kernelsu/Kconfig\"'\n    data = cfg.read_text()\n    if data.count(line)\
        \ > 1:\n        raise RuntimeError('drivers/Kconfig contains duplicate KernelSU entries')\n    if line not\
        \ in data:\n        # Scope to the last *top-level* endmenu, avoiding sed's global insertion.\n        marker\
        \ = '\\nendmenu'\n        pos = data.rfind(marker)\n        if pos == -1:\n            raise RuntimeError('drivers/Kconfig:\
        \ closing endmenu not found')\n        cfg.write_text(data[:pos] + '\\n' + line + '\\n' + data[pos:])\n\
        \    assert mk.read_text().count(makeline) == 1\n    assert cfg.read_text().count(line) == 1\n    print('[OK]\
        \ KernelSU Next legacy linked exactly once')\n\n\nif __name__ == '__main__':\n    try:\n        integrate(Path(sys.argv[1]\
        \ if len(sys.argv) == 2 else 'kernel'))\n    except (RuntimeError, OSError) as e:\n        print('ERROR:',\
        \ e, file=sys.stderr)\n        sys.exit(1)\nINTEGRATE_PY\npython3 - kernel <<'HOOKS_PY'\n#!/usr/bin/env\
        \ python3\n\"\"\"Manual hooks for pinned FirmanBell 4.4 + KernelSU Next legacy.\"\"\"\nfrom pathlib import\
        \ Path\nimport sys\nroot=Path(sys.argv[1]).resolve()\n\ndef edit(rel,old,new):\n    p=root/rel\n    s=p.read_text()\n\
        \    if s.count(old)!=1:\n        raise SystemExit(f'{rel}: expected exactly one anchor: {old!r}')\n   \
        \ p.write_text(s.replace(old,new,1))\n    print('[HOOK]',rel)\n\nedit('fs/exec.c','static int do_execveat_common(int\
        \ fd, struct filename *filename,',\n'''#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *, struct filename\
        \ **, void *, void *, int *);\n#endif\nstatic int do_execveat_common(int fd, struct filename *filename,''')\n\
        edit('fs/exec.c','\\tint retval;\\n\\n\\tif (IS_ERR(filename))',\n'''\\tint retval;\n#ifdef CONFIG_KSU\n\
        \\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\n\\tif (IS_ERR(filename))''')\n\
        edit('fs/open.c','SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)',\n'''#ifdef\
        \ CONFIG_KSU\nextern int ksu_handle_faccessat(int *, const char __user **, int *, int *);\n#endif\nSYSCALL_DEFINE3(faccessat,\
        \ int, dfd, const char __user *, filename, int, mode)''')\np=root/'fs/open.c'\ns=p.read_text(); pos=s.index('SYSCALL_DEFINE3(faccessat,');\
        \ end=s.index('\\n}',pos)\nbody=s[pos:end]\nold='\\tif (mode & ~S_IRWXO)'\nassert body.count(old)==1\nbody=body.replace(old,'''#ifdef\
        \ CONFIG_KSU\n\\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\\tif (mode & ~S_IRWXO)''')\n\
        p.write_text(s[:pos]+body+s[end:])\nedit('fs/read_write.c','SYSCALL_DEFINE3(read, unsigned int, fd, char\
        \ __user *, buf, size_t, count)',\n'''#ifdef CONFIG_KSU\nextern void ksu_handle_sys_read(unsigned int fd);\n\
        #endif\nSYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)''')\nedit('fs/read_write.c','SYSCALL_DEFINE3(read,\
        \ unsigned int, fd, char __user *, buf, size_t, count)\\n{\\n\\tstruct fd f = fdget_pos(fd);\\n\\tssize_t\
        \ ret = -EBADF;',\n'''SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n\\\
        tstruct fd f;\n\\tssize_t ret = -EBADF;\n#ifdef CONFIG_KSU\n\\tksu_handle_sys_read(fd);\n#endif\n\\tf =\
        \ fdget_pos(fd);''')\nedit('fs/stat.c','int vfs_fstatat(int dfd, const char __user *filename, struct kstat\
        \ *stat,',\n'''#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *, const char __user **, int *);\nextern\
        \ void ksu_handle_newfstat_ret(unsigned int *, struct stat __user **);\n#endif\nint vfs_fstatat(int dfd,\
        \ const char __user *filename, struct kstat *stat,''')\nedit('fs/stat.c','\\tunsigned int lookup_flags =\
        \ 0;\\n\\n\\tif ((flag &',\n'''\\tunsigned int lookup_flags = 0;\n#ifdef CONFIG_KSU\n\\tksu_handle_stat(&dfd,\
        \ &filename, &flag);\n#endif\n\n\\tif ((flag &''')\nold='\\t\\terror = cp_new_stat(&stat, statbuf);\\n\\\
        n\\treturn error;\\n}\\n\\nSYSCALL_DEFINE4(readlinkat,'\nedit('fs/stat.c',old,'''\\t\\terror = cp_new_stat(&stat,\
        \ statbuf);\n#ifdef CONFIG_KSU\n\\tif (!error)\n\\t\\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n\n\
        \\treturn error;\n}\n\nSYSCALL_DEFINE4(readlinkat,''')\nedit('kernel/reboot.c','SYSCALL_DEFINE4(reboot,\
        \ int, magic1, int, magic2, unsigned int, cmd,',\n'''#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int,\
        \ int, unsigned int, void __user **);\n#endif\nSYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned\
        \ int, cmd,''')\nedit('kernel/reboot.c','\\tchar buffer[256];\\n\\tint ret = 0;',\n'''\\tchar buffer[256];\n\
        \\tint ret = 0;\n#ifdef CONFIG_KSU\n\\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif''')\nedit('drivers/input/input.c','static\
        \ void input_handle_event(struct input_dev *dev,',\n'''#ifdef CONFIG_KSU\nextern int ksu_handle_input_handle_event(unsigned\
        \ int *, unsigned int *, int *);\n#endif\nstatic void input_handle_event(struct input_dev *dev,''')\nedit('drivers/input/input.c','\\\
        tint disposition;\\n\\n\\tdisposition = input_get_disposition',\n'''\\tint disposition;\n#ifdef CONFIG_KSU\n\
        \\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n\n\\tdisposition = input_get_disposition''')\n\
        HOOKS_PY\npython3 - kernel <<'COMPAT_PY'\n#!/usr/bin/env python3\n\"\"\"Linux 4.4 header adaptation. Only\
        \ the pinned KSU checkout is modified.\"\"\"\nfrom pathlib import Path\nimport sys\nkernel=Path(sys.argv[1]).resolve()\n\
        ksu=kernel/'KernelSU-Next/kernel'\nfor p in sorted(ksu.rglob('*')):\n    if p.suffix not in ('.c','.h'):\
        \ continue\n    s=p.read_text()\n    for old,new in [('linux/compiler_types.h','linux/compiler.h'),\n  \
        \                  ('linux/sched/signal.h','linux/sched.h'),\n                    ('linux/sched/task.h','linux/sched.h'),\n\
        \                    ('linux/sched/user.h','linux/sched.h'),\n                    ('linux/sched/task_stack.h','linux/sched.h')]:\n\
        \        if not (kernel/'include'/old).exists():\n            s=s.replace('<'+old+'>','<'+new+'>')\n   \
        \ if s!=p.read_text():\n        p.write_text(s)\n        print('[COMPAT]',p.relative_to(kernel))\np=ksu/'manager/apk_sign.c'\n\
        s=p.read_text()\nif '#include \"compat/kernel_compat.h\"' not in s:\n    s=s.replace('#include \"klog.h\"\
        ', '#include \"compat/kernel_compat.h\"\\n#include \"klog.h\"',1)\n    p.write_text(s)\n    print('[COMPAT]\
        \ manager/apk_sign.c: kvmalloc compatibility')\n# The pre-4.14 file APIs use an offset value, rather than\
        \ loff_t *.\n# The existing upstream wrappers adapt the signature and advance the position.\nfor rel in\
        \ ('policy/allowlist.c', 'runtime/ksud_integration.c'):\n    p=ksu/rel\n    s=p.read_text()\n    import\
        \ re\n    new=re.sub(r'\\bkernel_read\\(', 'ksu_kernel_read_compat(', s)\n    new=re.sub(r'\\bkernel_write\\\
        (', 'ksu_kernel_write_compat(', new)\n    if new!=s:\n        p.write_text(new)\n        print('[COMPAT]',rel,':\
        \ file I/O signature and offset')\np=ksu/'sulog/event.c'\ns=p.read_text()\nif 'in_compat_syscall()' in s:\n\
        \    p.write_text(s.replace('in_compat_syscall()', 'is_compat_task()'))\n    print('[COMPAT] sulog/event.c:\
        \ ARM64 compat task detection')\np=ksu/'compat/kernel_compat.h'\ns=p.read_text()\naddition='''\n/* Linux\
        \ 4.4 has no CFI instrumentation and predates these helper names. */\n#ifndef __nocfi\n#define __nocfi\n\
        #endif\n#ifndef ALIGN_DOWN\n#define ALIGN_DOWN(x, a) round_down(x, a)\n#endif\n'''\nif 'Linux 4.4 has no\
        \ CFI instrumentation' not in s:\n    s=s.replace('#define __KSU_H_KERNEL_COMPAT\\n','#define __KSU_H_KERNEL_COMPAT\\\
        n'+addition,1)\n    p.write_text(s)\n    print('[COMPAT] CFI annotation and downward alignment names')\n\
        p=ksu/'feature/adb_root.c'\ns=p.read_text()\nif '#include \"compat/kernel_compat.h\"' not in s:\n    p.write_text('#include\
        \ \"compat/kernel_compat.h\"\\n'+s)\n# Expose the configuration actually compiled, rather than an unrelated\
        \ stock config.\np=kernel/'kernel/Makefile'\ns=p.read_text()\nold='$(obj)/config_data.gz: arch/arm64/configs/platina-stock_defconfig\
        \ FORCE'\nnew='$(obj)/config_data.gz: .config FORCE'\nif old in s:\n    assert s.count(old)==1\n    p.write_text(s.replace(old,new,1))\n\
        \    print('[COMPAT] IKCONFIG: embed the actual build configuration')\nelse:\n    assert new in s\nCOMPAT_PY\n\
        cat > build-logs/legacy-backports.patch <<'BACKPORT_PATCH'\ndiff --git a/fs/internal.h b/fs/internal.h\n\
        index 0ec68117..788e4a0b 100644\n--- a/fs/internal.h\n+++ b/fs/internal.h\n@@ -64,6 +64,7 @@ extern int\
        \ finish_automount(struct vfsmount *, struct path *);\n extern int sb_prepare_remount_readonly(struct super_block\
        \ *);\n \n extern void __init mnt_init(void);\n+int path_umount(struct path *path, int flags);\n \n extern\
        \ int __mnt_want_write(struct vfsmount *);\n extern int __mnt_want_write_file(struct file *);\ndiff --git\
        \ a/fs/namespace.c b/fs/namespace.c\nindex edeb8b9c..d8a0b500 100644\n--- a/fs/namespace.c\n+++ b/fs/namespace.c\n\
        @@ -1734,6 +1734,36 @@ SYSCALL_DEFINE1(oldumount, char __user *, name)\n \n #endif\n \n+static int can_umount(const\
        \ struct path *path, int flags)\n+ {\n+\t struct mount *mnt = real_mount(path->mnt);\n+\t if (flags & ~(MNT_FORCE\
        \ | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n+\t\t return -EINVAL;\n+\t if (!may_mount())\n+\t\t return\
        \ -EPERM;\n+\t if (path->dentry != path->mnt->mnt_root)\n+\t\t return -EINVAL;\n+\t if (!check_mnt(mnt))\n\
        +\t\t return -EINVAL;\n+\t if (mnt->mnt.mnt_flags & MNT_LOCKED)\n+\t\t return -EINVAL;\n+\t if (flags &\
        \ MNT_FORCE && !capable(CAP_SYS_ADMIN))\n+\t\t return -EPERM;\n+\t return 0;\n+ }\n+\n+int path_umount(struct\
        \ path *path, int flags)\n+ {\n+\t struct mount *mnt = real_mount(path->mnt);\n+\t int ret;\n+\t ret = can_umount(path,\
        \ flags);\n+\t if (!ret)\n+\t\t ret = do_umount(mnt, flags);\n+\t dput(path->dentry);\n+\t mntput_no_expire(mnt);\n\
        +\t return ret;\n+ }\n+\n static bool is_mnt_ns_file(struct dentry *dentry)\n {\n \t/* Is this a proxy for\
        \ a mount namespace? */\ndiff --git a/include/linux/seccomp.h b/include/linux/seccomp.h\nindex 50c460a9..0fe69924\
        \ 100644\n--- a/include/linux/seccomp.h\n+++ b/include/linux/seccomp.h\n@@ -9,6 +9,7 @@\n #ifdef CONFIG_SECCOMP\n\
        \ \n #include <linux/thread_info.h>\n+#include <linux/atomic.h>\n #include <asm/seccomp.h>\n \n struct seccomp_filter;\n\
        @@ -25,6 +26,7 @@ struct seccomp_filter;\n  */\n struct seccomp {\n \tint mode;\n+\tatomic_t filter_count;\n\
        \ \tstruct seccomp_filter *filter;\n };\n \ndiff --git a/security/selinux/hooks.c b/security/selinux/hooks.c\n\
