hd_check=$(git -C kernel apply --check ../build-logs/legacy-backports.patch 2>&1 || true)
git -C kernel apply ../build-logs/legacy-backports.patch || echo "Patch applied with warnings/manually"
git -C kernel diff > build-logs/kernel-changes.patch
git -C kernel/KernelSU-Next diff > build-logs/ksu-compat.patch
"
    - name: Generate platina_defconfig and verify manual hook settings
      shell: bash
      run: |
        set -euo pipefail
        make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64           CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CROSS_COMPILE=aarch64-linux-android-           CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-           "$DEFCONFIG" 2>&1 | tee build-logs/config.log
        kernel/scripts/config --file kernel/out/.config           -e KSU -e KSU_NEXT -d KSU_DEBUG -d KSU_KPROBES_HOOK -d KSU_KPROBE_HOOKS           -d KSU_SYSCALL_TABLE_HOOK -d LTO -d LTO_CLANG -d THINLTO -e LTO_NONE
        if grep -Eq '^[[:space:]]*config KSU_MANUAL_HOOK' kernel/KernelSU-Next/kernel/Kconfig; then
          kernel/scripts/config --file kernel/out/.config -e KSU_MANUAL_HOOK
        fi
        make -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64           CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CROSS_COMPILE=aarch64-linux-android-           CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-           olddefconfig 2>&1 | tee -a build-logs/config.log
        grep -qx 'CONFIG_KSU=y' kernel/out/.config
        grep -qx 'CONFIG_KSU_NEXT=y' kernel/out/.config
        echo '[OK] CONFIG_KSU=y dan CONFIG_KSU_NEXT=y berhasil diaktifkan!'
        grep -E '^CONFIG_KSU|^# CONFIG_KSU' kernel/out/.config | tee build-logs/ksu-config.txt
        grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' kernel/out/.config
        grep -qx 'CONFIG_LTO_NONE=y' kernel/out/.config
    - name: Compile SELinux, KernelSU Next, and the complete kernel
      shell: bash
      run: |
        set -euo pipefail
        args=( -C kernel O="$GITHUB_WORKSPACE/kernel/out" ARCH=arm64   CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump   CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-   CLANG_TRIPLE=aarch64-linux-gnu- )
        make "${args[@]}" -j"$BUILD_JOBS" security/selinux/ 2>&1 | tee build-logs/selinux.log
        make "${args[@]}" -j"$BUILD_JOBS" drivers/kernelsu/ 2>&1 | tee build-logs/ksu-objects.log
        make "${args[@]}" -j"$BUILD_JOBS" Image.gz-dtb dtbs 2>&1 | tee build-logs/build.log
        test -s kernel/out/arch/arm64/boot/Image.gz-dtb
        test -s kernel/out/vmlinux
        llvm-nm --defined-only kernel/out/vmlinux > build-logs/vmlinux-symbols.txt
        for sym in kernelsu_init ksu_handle_execveat ksu_handle_sys_read ksu_handle_sys_reboot; do
          grep -Eq "[[:space:]]${sym}$" build-logs/vmlinux-symbols.txt
        done
    - name: Package kernel files and checksums (not flashable)
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        cp kernel/out/arch/arm64/boot/Image.gz-dtb dist/Image.gz-dtb
        cp kernel/out/.config dist/platina.config
        cp build-logs/{kernel-commit.txt,ksu-commit.txt,clang-version.txt} dist/
        ( cd dist && sha256sum Image.gz-dtb > SHA256SUMS )
        zip -q -r "platina-ksunext-clang12-run${GITHUB_RUN_NUMBER}-NOT-FLASHABLE.zip" dist
        {
          echo '### Platina KernelSU Next build'
          echo "- Kernel: FirmanBell/msm-4.4 ($KERNEL_BRANCH)"
          echo "- Defconfig: $DEFCONFIG"
          echo "- Compiler: $(head -n 1 build-logs/clang-version.txt)"
          echo "- KernelSU ref: $(cat build-logs/ksu-commit.txt)"
          echo '- Hook mode: manual; 64-bit and compat exec; safe-mode input hook'
          echo '- Output: Image.gz-dtb (NOT directly flashable)'
        } | tee build-logs/summary.txt >> "$GITHUB_STEP_SUMMARY"
    - name: Summarize first build error (when failed)
      if: failure()
      shell: bash
      run: "set -uo pipefail
mkdir -p build-logs
for log in build-logs/build.log build-logs/ksu-objects.log build-logs/selinux.log;        \ do
  if [[ -s "$log" ]] && grep -Eiq 'fatal error:|error:|undefined reference|Error [0-9]+' "$log"        ; then
    cp "$log" build-logs/failure.log
    break
  fi
done
if [[ -s build-logs/failure.log ]];        \ then
  echo '=== First relevant compiler and linker errors ==='
  grep -Enim 20 'fatal error:|(^|[[:space:]])error:|undefined        \ reference|No rule to make target|ld.lld: error:|clang: error:' \
    build-logs/failure.log | tee build-logs/first-errors.txt        \ || true
  first_line="$(grep -Enim 1 'fatal error:|(^|[[:space:]])error:|undefined reference|No rule        \ to make target|ld.lld: error:|clang: error:' \
    build-logs/failure.log | cut -d: -f1 || true)"
        \  if [[ -n "$first_line" ]]; then
    start=$(( first_line > 8 ? first_line - 8 : 1 ))
    end=$Package        \ first_line + 22 
    echo '=== Context of first error ==='
    sed -n "${start},${end}p" build-logs/failure.log        \ | tee build-logs/first-error-context.txt
    {
      echo '### Kernel build failed — first diagnostic'
              echo '```text'
      cat build-logs/first-error-context.txt
      echo '```'
    } >> "$GITHUB_STEP_SUMMARY"
          else
    echo 'No compiler/linker error token found in build.log.' | tee build-logs/first-errors.txt
          fi
else
  echo 'Build log was not created; failure occurred before kernel compilation.' | tee build-logs/first-errors.txt
        fi
"
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: platina-ksunext-clang12-logs-${{ github.run_number }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          build-logs/
          kernel/out/.config
    - name: Upload compiled kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: platina-ksunext-clang12-kernel-${{ github.run_number }}
        if-no-files-found: error
        retention-days: 14
        path: |
          dist/
on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Number of parallel jobs (2 recommended for GitHub-hosted runners)
        required: true
        default: '2'
        type: choice
        options:
        - '1'
        - '2'
        - '3'
        - '4'