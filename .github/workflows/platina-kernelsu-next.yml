#!/usr/bin/env python3
"""Linux 4.4 header adaptation. Only        \ the pinned KSU checkout is modified."""
from pathlib import Path
import sys
kernel=Path(sys.argv[1]).resolve()
        ksu=kernel/'KernelSU-Next/kernel'
for p in sorted(ksu.rglob('*')):
    if p.suffix not in ('.c','.h'):        \ continue
    s=p.read_text()
    for old,new in [('linux/compiler_types.h','linux/compiler.h'),
          \                  ('linux/sched/signal.h','linux/sched.h'),
                    ('linux/sched/task.h','linux/sched.h'),
        \                    ('linux/sched/user.h','linux/sched.h'),
                    ('linux/sched/task_stack.h','linux/sched.h')]:
        \        if not (kernel/'include'/old).exists():
            s=s.replace('<'+old+'>','<'+new+'>')
           \ if s!=p.read_text():
        p.write_text(s)
        print('[COMPAT]',p.relative_to(kernel))
p=ksu/'manager/apk_sign.c'
        s=p.read_text()
if '#include "compat/kernel_compat.h"' not in s:
    s=s.replace('#include "klog.h"        ', '#include "compat/kernel_compat.h"\n#include "klog.h"',1)
    p.write_text(s)
    print('[COMPAT]        \ manager/apk_sign.c: kvmalloc compatibility')
# The pre-4.14 file APIs use an offset value, rather than        \ loff_t *.
# The existing upstream wrappers adapt the signature and advance the position.
for rel in        \ ('policy/allowlist.c', 'runtime/ksud_integration.c'):
    p=ksu/rel
    s=p.read_text()
    import        \ re
    new=re.sub(r'\bkernel_read\(', 'ksu_kernel_read_compat(', s)
    new=re.sub(r'\bkernel_write\        (', 'ksu_kernel_write_compat(', new)
    if new!=s:
        p.write_text(new)
        print('[COMPAT]',rel,':        \ file I/O signature and offset')
p=ksu/'sulog/event.c'
s=p.read_text()
if 'in_compat_syscall()' in s:
        \    p.write_text(s.replace('in_compat_syscall()', 'is_compat_task()'))
    print('[COMPAT] sulog/event.c:        \ ARM64 compat task detection')
p=ksu/'compat/kernel_compat.h'
s=p.read_text()
addition='''
/* Linux        \ 4.4 has no CFI instrumentation and predates these helper names. */
#ifndef __nocfi
#define __nocfi
        #endif
#ifndef ALIGN_DOWN
#define ALIGN_DOWN(x, a) round_down(x, a)
#endif
'''
if 'Linux 4.4 has no        \ CFI instrumentation' not in s:
    s=s.replace('#define __KSU_H_KERNEL_COMPAT\n','#define __KSU_H_KERNEL_COMPAT\        n'+addition,1)
    p.write_text(s)
    print('[COMPAT] CFI annotation and downward alignment names')
        p=ksu/'feature/adb_root.c'
s=p.read_text()
if '#include "compat/kernel_compat.h"' not in s:
    p.write_text('#include        \ "compat/kernel_compat.h"\n'+s)
# Expose the configuration actually compiled, rather than an unrelated        \ stock config.
p=kernel/'kernel/Makefile'
s=p.read_text()
old='$(obj)/config_data.gz: arch/arm64/configs/platina-stock_defconfig        \ FORCE'
new='$(obj)/config_data.gz: .config FORCE'
if old in s:
    assert s.count(old)==1
    p.write_text(s.replace(old,new,1))
        \    print('[COMPAT] IKCONFIG: embed the actual build configuration')
else:
    assert new in s
COMPAT_PY
